<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Shadows and outlines</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 13px 3px 5px #888888;
        }
        .text-element{
            text-shadow:2px 2px 4px #888888;
            outline: 2px solid red;
            border: 2px  solid black;
            border-radius: 2px;
            outline-offset: 13px;
        }
    </style>
</head>
<body>
    <div class="box">I am the box</div>
    <p class="text-element">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Magnam distinctio explicabo soluta!</p>
</body>
</html>
