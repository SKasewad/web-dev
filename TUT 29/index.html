<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Making Card</title>
    <style>
      .card {
        height: 412px;
        width: 222px;
        border: 1px solid black;
        padding: 3px;
        border-radius: 11px;
        
      }
      img {
        width: 100%;
        border-radius: 10px;
        /* margin: 2px; */
      }
      .button {
        background-color: azure;
        border: 1px solid black;
        border-radius: 12px;
      }
      #read {
        position: relative;
        left: 61px;
        bottom: -12px;
        background-color: rgb(160, 160, 239);
        color: white;
        border: 1px solid black;
        border-radius: 10px;
        height: 30px;
      }
      h2 {
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
      }
      p{
        text-decoration: solid;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="card.webp" alt="" />
      <button class="button">Nature</button>
      <button class="button">Lake</button>
      <h2>Lago di Braise</h2>
      <p>
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Omnis incidunt
        eos, nam exercitationem quasi, vitae doloribus quibusdam tempore debitis
        odio modi quae sit!
      </p>
      <button id="read">Read more</button>
    </div>
  </body>
</html>
