<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Design a layout</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      .nav {
        height: 60px;
        width: 100vw;
        background-color: rgb(185, 132, 235);
        position: sticky;
        top: 0;
      }
      /* body{
            position: relative;
        } */
      .container {
        height: 600px;
        width: 97vw;
        background-color: rgb(180, 43, 43);
        margin: 0 auto;
        margin-top: 20px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .box {
        height: 500px;
        width: 500px;
        background-color: rgb(129, 217, 51);
        margin: 60px;
      }
      .welcome {
        height: 200px;
        width: 95vw;
        border: 4px solid black;
        margin: auto;
        margin-top: 20px;
        margin-bottom: 100px;
        text-align: center;
        padding-top: 100px;
        font-size: 45px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        border-radius: 10px;
      }
      .circle {
        right: 0px;
        bottom: 100px;
        width: 120px;
        height: 120px;
        background-color: skyblue;
        border-radius: 50%;
        position: fixed;
        text-align:center;
        
      }
      .end {
        height: 60px;
        width: 100vw;
        background-color: rgb(185, 132, 235);
      }
    </style>
  </head>
  <body>
    <nav class="nav">
      <div></div>
    </nav>
    <div class="container">
      <div class="box"></div>
      <div class="box"></div>
    </div>
    <div class="circle">SK</div>
    <div class="welcome">Welcome to the web-developement course</div>
    <footer class="end"></footer>
  </body>
</html>
